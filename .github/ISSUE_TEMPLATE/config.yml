  - name: Setup help — database, OAuth, Notion
    url: https://github.com/prasad-kmd/PM-Web_V2/tree/main/docs
    about: The guides in /docs cover the three setups people get stuck on.

  - name: Why is the project shaped this way?
    url: https://github.com/prasad-kmd/PM-Web_V2/blob/main/docs/planning/02-implementation-roadmap.md
