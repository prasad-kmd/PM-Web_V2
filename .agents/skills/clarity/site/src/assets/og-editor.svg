<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title description" role="img" viewBox="0 0 1200 630"><title id="title">Clarity Writing Editor</title><desc id="description">A private browser editor for AI writing tells, readability, and Clarity review.</desc><rect width="1200" height="630" fill="#fafafa"/><path stroke="#e5e5e5" d="M0 1H1200M0 629H1200"/><g transform="translate(72 48)"><rect width="32" height="32" fill="#171717" rx="7"/><path fill="none" stroke="#fff" stroke-linejoin="round" stroke-width="1.6" d="M16 7.5l1.55 5.2a3.2 3.2 0 0 0 2.15 2.15L25 16.4l-5.3 1.55a3.2 3.2 0 0 0-2.15 2.15L16 25.4l-1.55-5.3a3.2 3.2 0 0 0-2.15-2.15L7 16.4l5.3-1.55a3.2 3.2 0 0 0 2.15-2.15L16 7.5Z"/><text x="46" y="22" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="-.3">Clarity</text><path stroke="#dedede" d="M112 7v18"/><text x="127" y="22" fill="#737373" font-family="Arial, Helvetica, sans-serif" font-size="16">Writing Editor</text></g><g><text fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-3.2" transform="translate(72 164)"><tspan x="0" y="0">Write with</tspan> <tspan x="0" y="76">clarity.</tspan></text><text x="2" y="300" fill="#525252" font-family="Arial, Helvetica, sans-serif" font-size="22" transform="translate(72 164)"><tspan x="2" dy="0">Review AI writing tells, readability, and the</tspan> <tspan x="2" dy="31">questions pattern matching cannot settle.</tspan></text><g transform="translate(72 164) translate(2 380)"><rect width="356" height="40" fill="#fff" stroke="#e5e5e5" rx="7"/><circle cx="21" cy="20" r="4" fill="#16a34a"/><text x="35" y="25" fill="#525252" font-family="Arial, Helvetica, sans-serif" font-size="14">Private in your browser</text><path stroke="#e5e5e5" d="M210 10v20"/><text x="225" y="25" fill="#737373" font-family="Arial, Helvetica, sans-serif" font-size="13">clarity.addy.ie/app</text></g></g><g transfo