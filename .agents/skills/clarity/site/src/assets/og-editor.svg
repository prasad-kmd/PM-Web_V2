 fill="#737373" font-family="Arial, Helvetica, sans-serif" font-size="6">Tells</text><text x="58" y="215" fill="#737373" font-family="Arial, Helvetica, sans-serif" font-size="6">Grade</text><rect width="206" height="348" x="114" y="67" fill="#fff" stroke="#e5e5e5" rx="8"/><text x="128" y="89" fill="#525252" font-family="Arial, Helvetica, sans-serif" font-size="7">Saved locally</text><text x="280" y="89" fill="#8f8f8f" font-family="Arial, Helvetica, sans-serif" font-size="7">124 words</text><path stroke="#ededed" d="M114 99h206"/><g fill="#404040" font-family="Arial, Helvetica, sans-serif" font-size="8.5"><text x="137" y="132">A clear sentence gives the reader</text><text x="137" y="149">something concrete to work with.</text><text x="137" y="184">The report was carefully written by</text><text x="137" y="201">the committee under pressure.</text><text x="137" y="236">Name the source. Explain why the</text><text x="137" y="253">result matters and what changed.</text><text x="137" y="288">Keep the useful detail. Cut the filler.</text></g><rect width="44" height="4" x="193" y="139" fill="#ea580c" opacity=".45" rx="2"/><rect width="50" height="4" x="198" y="191" fill="#0d9488" opacity=".45" rx="2"/><rect width="60" height="4" x="137" y="243" fill="#e11d48" opacity=".42" rx="2"/><rect width="86" height="5" x="137" y="298" fill="#facc15" opacity=".28" rx="2.5"/><g transform="translate(346 63)"><rect width="82" height="25" fill="#ededed" stroke="#e5e5e5" rx="5"/><rect width="28" height="21" x="2" y="2" fill="#fff" rx="4"/><text x="9" y="16" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="7">Tells</text><text x="36" y="16" fill="#737373" font-family="Arial, Helvetica, sans-serif" font-size="7">Clarity</text><text x="64" y="16" fill="#737373" font-family="Arial, Helvetica, sans-serif" font-size="7">Stats</text></g><text x="348" y="112" fill="#737373" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" letter-spacing=".7">AI TELLS</text><g fill="#525252" font-family="Arial, Helvetica, sans-serif" font-size="7"><circle cx="352" cy="130" r="3" fill="#c026d3"/><text x="361" y="133">AI phrases</text><text x="418" y="133" fill="#8f8f8f">2</text><circle cx="352" cy="151" r="3" fill="#ea580c"/><text x="361" y="154">AI words</text><text x="418" y="154" fill="#8f8f8f">3</text><circle cx="352" cy="172" r="3" fill="#e11d48"/><text x="361" y="175">Structures</text><text x="418" y="175" fill="#8f8f8f">2</text></g><text x="348" y="208" fill="#737373" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" letter-spacing=".7">FINDINGS</text><rect width="82" height="55" x="346" y="221" fill="#fff" stroke="#e5e5e5" rx="6"/><rect width="3" height="55" x="346" y="221" fill="#ea580c" rx="1.5"/><text x="356" y="240" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="7">“carefully”</text><text x="356" y="256" fill="#737373" font-family="Arial, Helvetica, sans-serif" font-size="6">Check the modifier.</text></g></svg>